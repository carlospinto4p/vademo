name: Build APK

# Builds the debug APK so it can be installed on a phone without a
# computer: every run uploads it as a workflow artifact, and runs on
# main (or started by hand) also replace the `debug-latest` prerelease,
# whose asset is a plain .apk the phone's browser can download directly.

on:
  push:
    branches:
      - main
      - 'claude/**'
      # Branches of Claude Code cloud sessions, so a session's own
      # branch is checked before it merges into main.
      - 'ccr-**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Each action is on a release that runs on Node 24 (checked
      # 2026-11-16). setup-gradle stays on v5: v6 moves its caching into a
      # proprietary component under separate terms of use.
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # packages: '' because the action's default list still asks for the
      # obsolete `tools` package, which the SDK repository no longer serves.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # compileSdk is 37. The ubuntu-26.04 image ships that platform; older
      # images did not, so it is still installed when missing. Platforms are published per minor version now (36.1, 37.0, 37.1…),
      # so `platforms;android-37` does not exist: `compileSdk = 37` with no
      # `compileSdkMinor` means 37.0. Both names are tried, across every
      # channel (0 stable, 1 beta, 2 dev, 3 canary), and if none resolves
      # the platforms that do exist are printed instead of failing later
      # inside Gradle with a vaguer message.
      # Not cached with actions/cache: the ubuntu-26.04 image already ships
      # it (seen 2026-11-16), and the cache came to 350 MB to restore on
      # every run for nothing.
      - name: Install the compileSdk platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools'
          if ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            echo "compileSdk platform already installed on the runner"
            exit 0
          fi
          for package in 'platforms;android-37.0' 'platforms;android-37'; do
            for channel in 0 1 2 3; do
              yes | sdkmanager --licenses --channel=$channel >/dev/null 2>&1 || true
              if sdkmanager --channel=$channel "$package"; then
                exit 0
              fi
            done
          done
          echo "::error::no SDK platform for compileSdk 37 on any channel"
          sdkmanager --list --channel=3 | grep -E 'platforms;android-' | sort -u
          exit 1

      # One Gradle call, so the JVM starts and the build is configured once.
      - name: Unit tests and the debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK after the version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="vademo-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The phone installs one build over another only while this stays the
      # same, so it goes in the log of every build. It takes apksigner and
      # not `keytool -printcert -jarfile`: with minSdk 26 the APK carries
      # only the v2/v3 signature, which keytool cannot read.
      - name: Show which key signed it
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs '${{ steps.apk.outputs.name }}' | grep -i 'SHA-256 digest'

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # One moving prerelease rather than one per commit, so its page
      # (releases/tag/debug-latest) is one saved link that always lists the
      # newest build. The APK keeps its version in its name, so downloads can
      # be told apart; a link straight to the file therefore stops working
      # at the next build, and the page is the link to keep.
      - name: Publish it as the debug-latest prerelease
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ${{ steps.apk.outputs.version }}" \
            --notes "Debug APK built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d). Signed with the standard debug key: it installs alongside nothing else and will not upgrade a release-signed install." \
            "${{ steps.apk.outputs.name }}"
